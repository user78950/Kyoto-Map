<link rel="stylesheet" href="styles.css"/><style>@layer base { html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style><style id="kh-link-style">

        <span id="foot-note">교토 문화유산 37선 &amp; 고슈인(御朱印) 아카이브 v1.0</span>
      </div>

<script>
(function(){
  var heroBg=document.getElementById('hero-bg');
  /* 배경이 천천히 다가오는 느낌 */
  requestAnimationFrame(function(){setTimeout(function(){heroBg&&heroBg.classList.remove('scale-105')},60)});

  /* 시작 · 기록 불러오기 · 오프라인 지도 */
  function go(url){if(window.KH_go)window.KH_go(url);else location.href=url}
  document.getElementById('btn-start').addEventListener('click',function(){go('map.html')});
  document.getElementById('btn-archive').addEventListener('click',function(){go('notebook.html')});
  var toastT;
  function toast(m){var t=document.getElementById('splash-toast');t.textContent=m;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(function(){t.style.opacity='0'},2400)}
  document.getElementById('btn-offline').addEventListener('click',function(){toast('오프라인 지도는 다음 업데이트에서 지원할 예정이에요.')});

  /* 저장된 프로필과 기록이 있으면 이어보기 문구로 */
  try{
    var p=JSON.parse(localStorage.getItem('kh-profile')||'null');var n=JSON.parse(localStorage.getItem('kh-notes')||'[]');
    if(p&&p.name)document.getElementById('archive-label').textContent=p.name+' 님의 기록 이어보기'+(n.length?' ('+n.length+')':'');
  }catch(e){}

  /* 명소 수 */
  if(window.KH_SITES)document.getElementById('foot-note').innerHTML='교토 문화유산 '+window.KH_SITES.length+'선 &amp; 고슈인(御朱印) 아카이브 v1.0';

  /* 교토 현지 시각 기준 후시미 이나리 분위기 */
  var d=new Date(Date.now()+(9*60+new Date().getTimezoneOffset())*60000),h=d.getHours()+d.getMinutes()/60;
  var mood=h>=6&&h<8?['고요한 사색','시간대입니다']:h>=8&&h<10?['한적한 아침','시간대입니다']:h>=10&&h<16?['참배객이 많은','시간대입니다']:h>=16&&h<18.5?['노을 진 도리이','시간대입니다']:['밤의 등롱','아래 참배할 수 있어요'];
  document.getElementById('quiet-text').innerHTML='지금 후시미 이나리는 <span class="font-semibold text-white">‘'+mood[0]+'’</span> '+mood[1];

  /* 종소리: 누를 때만 켜짐 (브라우저 자동 재생 제한) */
  var soundBtn=document.getElementById('sound-toggle'),bell=document.getElementById('bell-icon'),on=false,ctx=null;
  function ring(){
    try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();var t=ctx.currentTime;
      [[220,1],[440,.5],[661,.28],[1102,.12]].forEach(function(f){var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f[0];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18*f[1],t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+4);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+4.1)});
    }catch(e){}
  }
  soundBtn.addEventListener('click',function(){
    on=!on;bell.textContent=on?'notifications_active':'notifications_off';bell.style.color=on?'#ffdea5':'rgba(255,255,255,.55)';soundBtn.setAttribute('aria-pressed',on);
    if(on)ring();
  });
  bell.style.color='rgba(255,255,255,.55)';

  /* 엠블럼을 누르면 살짝 숨 쉬듯 */
  var seal=document.getElementById('seal-emblem');
  if(seal&&heroBg)seal.addEventListener('click',function(){heroBg.classList.add('scale-110');setTimeout(function(){heroBg.classList.remove('scale-110')},600);if(on)ring()});
})();
</script>
</div></main><div id="splash-toast" role="status" aria-live="polite" class="fixed left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-[#1b1b21]/90 text-white text-[12px] shadow-xl transition-opacity duration-300 pointer-events-none" style="opacity:0;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px))"></div>

<script id="kh-link-script">
/* 네 화면을 잇는 공통 내비게이션 */
(function(){
  var page=location.pathname.split('/').pop()||'map.html';
  function go(url){
    if(!url)return;
    document.body.classList.add('kh-leaving');
    setTimeout(function(){location.href=url},150);
  }
  function wire(selector,text,url){
    document.querySelectorAll(selector).forEach(function(el){
      if(el.textContent.replace(/\s+/g,' ').indexOf(text)>-1&&!el.dataset.go){el.dataset.go=url;}
    });
  }
  if(page==='detail.html'){ wire('button','도장 보기','notebook.html'); }
  if(page==='routes.html'){
    wire('button','지도에서 전체 경로 보기','map.html');
    wire('button','코스 안내 시작하기','map.html');
  }
  if(page==='notebook.html'){
    document.querySelectorAll('.cursor-pointer').forEach(function(c){
      var t=c.textContent;
      if(t.indexOf('기요미즈데라')>-1&&t.indexOf('미수집')<0&&!c.dataset.go)c.dataset.go='detail.html';
      else if(t.indexOf('킨카쿠지')>-1&&!c.dataset.go)c.dataset.go='map.html?site=kinkaku';
      else if(t.indexOf('후시미 이나리')>-1&&!c.dataset.go)c.dataset.go='map.html?site=fushimi';
      else if(t.indexOf('니조 성')>-1&&!c.dataset.go)c.dataset.go='map.html?site=nijo';
      else if(t.indexOf('료안지')>-1&&!c.dataset.go)c.dataset.go='map.html?site=ryoanji';
      else if(t.indexOf('미수집 슬롯')>-1&&!c.dataset.go)c.dataset.go='map.html';
    });
  }
  /* 화면 안에서 새로 그려진 링크에도 다시 연결할 수 있도록 공개 */
  window.KH_bindLinks=function(root){
    root=root||document;
    root.querySelectorAll('[data-go]').forEach(function(el){
      if(el.dataset.khBound)return;el.dataset.khBound='1';
      if(!el.matches('a,button')){el.setAttribute('role','link');el.setAttribute('tabindex','0');}
      el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();go(el.dataset.go)});
      el.addEventListener('keydown',function(e){if(e.key==='Enter'){go(el.dataset.go)}});
    });
    root.querySelectorAll('a[href]').forEach(function(a){
      var target=a.getAttribute('href');
      if(!/^[a-z]+\.html(\?.*)?$/.test(target)||a.dataset.khBound)return;a.dataset.khBound='1';
      a.addEventListener('click',function(e){
        if(e.metaKey||e.ctrlKey)return;
        e.preventDefault();
        if(target===page){window.scrollTo({top:0,behavior:'smooth'});return}
        go(target);
      });
    });
  };
  /* 저장된 프로필 사진/인장을 헤더 아바타에 반영 */
  window.KH_applyAvatar=function(){
    var p=null;try{p=JSON.parse(localStorage.getItem('kh-profile'))}catch(e){}
    if(!p||!p.avatar)return;
    document.querySelectorAll('a[data-path="traveler-profile"]').forEach(function(a){
      var first=a.firstElementChild;if(!first)return;var el;
      if(p.avatar.type==='photo'){el=document.createElement('img');el.src=p.avatar.data;el.alt='프로필';el.className='w-8 h-8 rounded-full object-cover kh-avatar'}
      else{var c={vermilion:'bg-primary-container text-on-primary',matcha:'bg-secondary text-on-secondary',gold:'bg-tertiary-container text-on-tertiary-container',sumi:'bg-inverse-surface text-inverse-on-surface'}[p.avatar.color]||'bg-primary-container text-on-primary';
        el=document.createElement('span');el.className='w-8 h-8 rounded-full flex items-center justify-center font-headline-sm font-bold text-[15px] kh-avatar '+c;el.textContent=p.avatar.char}
      el.dataset.khFb='1';first.replaceWith(el);
    });
  };
  window.KH_applyAvatar();
  window.KH_go=go;
  window.KH_bindLinks(document);
  window.addEventListener('pageshow',function(){document.body.classList.remove('kh-leaving')});
})();
</script>
