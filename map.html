<script id="kh-link-script">
/* 네 화면을 잇는 공통 내비게이션 */
(function(){
  var page=location.pathname.split('/').pop()||'map.html';
  function go(url){
    if(!url)return;
    document.body.classList.add('kh-leaving');
    setTimeout(function(){location.href=url},150);
  }
  function wire(selector,text,url){
    document.querySelectorAll(selector).forEach(function(el){
      if(el.textContent.replace(/\s+/g,' ').indexOf(text)>-1&&!el.dataset.go){el.dataset.go=url;}
    });
  }
  if(page==='detail.html'){ wire('button','도장 보기','notebook.html'); }
  if(page==='routes.html'){
    wire('button','지도에서 전체 경로 보기','map.html');
    wire('button','코스 안내 시작하기','map.html');
  }
  if(page==='notebook.html'){
    document.querySelectorAll('.cursor-pointer').forEach(function(c){
      var t=c.textContent;
      if(t.indexOf('기요미즈데라')>-1&&t.indexOf('미수집')<0&&!c.dataset.go)c.dataset.go='detail.html';
      else if(t.indexOf('킨카쿠지')>-1&&!c.dataset.go)c.dataset.go='map.html?site=kinkaku';
      else if(t.indexOf('후시미 이나리')>-1&&!c.dataset.go)c.dataset.go='map.html?site=fushimi';
      else if(t.indexOf('니조 성')>-1&&!c.dataset.go)c.dataset.go='map.html?site=nijo';
      else if(t.indexOf('료안지')>-1&&!c.dataset.go)c.dataset.go='map.html?site=ryoanji';
      else if(t.indexOf('미수집 슬롯')>-1&&!c.dataset.go)c.dataset.go='map.html';
    });
  }
  /* 화면 안에서 새로 그려진 링크에도 다시 연결할 수 있도록 공개 */
  window.KH_bindLinks=function(root){
    root=root||document;
    root.querySelectorAll('[data-go]').forEach(function(el){
      if(el.dataset.khBound)return;el.dataset.khBound='1';
      if(!el.matches('a,button')){el.setAttribute('role','link');el.setAttribute('tabindex','0');}
      el.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();go(el.dataset.go)});
      el.addEventListener('keydown',function(e){if(e.key==='Enter'){go(el.dataset.go)}});
    });
    root.querySelectorAll('a[href]').forEach(function(a){
      var target=a.getAttribute('href');
      if(!/^[a-z]+\.html(\?.*)?$/.test(target)||a.dataset.khBound)return;a.dataset.khBound='1';
      a.addEventListener('click',function(e){
        if(e.metaKey||e.ctrlKey)return;
        e.preventDefault();
        if(target===page){window.scrollTo({top:0,behavior:'smooth'});return}
        go(target);
      });
    });
  };
  /* 저장된 프로필 사진/인장을 헤더 아바타에 반영 */
  window.KH_applyAvatar=function(){
    var p=null;try{p=JSON.parse(localStorage.getItem('kh-profile'))}catch(e){}
    if(!p||!p.avatar)return;
    document.querySelectorAll('a[data-path="traveler-profile"]').forEach(function(a){
      var first=a.firstElementChild;if(!first)return;var el;
      if(p.avatar.type==='photo'){el=document.createElement('img');el.src=p.avatar.data;el.alt='프로필';el.className='w-8 h-8 rounded-full object-cover kh-avatar'}
      else{var c={vermilion:'bg-primary-container text-on-primary',matcha:'bg-secondary text-on-secondary',gold:'bg-tertiary-container text-on-tertiary-container',sumi:'bg-inverse-surface text-inverse-on-surface'}[p.avatar.color]||'bg-primary-container text-on-primary';
        el=document.createElement('span');el.className='w-8 h-8 rounded-full flex items-center justify-center font-headline-sm font-bold text-[15px] kh-avatar '+c;el.textContent=p.avatar.char}
      el.dataset.khFb='1';first.replaceWith(el);
    });
  };
  window.KH_applyAvatar();
  window.KH_bindLinks(document);
  window.addEventListener('pageshow',function(){document.body.classList.remove('kh-leaving')});
})();
</script>
